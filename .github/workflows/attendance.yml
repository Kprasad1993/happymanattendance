name: Daily Attendance

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'
    # 6:30 PM IST = 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (check_in or sign_out)'
        required: false
        default: ''

jobs:
  attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Attendance Script
        env:
          HRMS_EMAIL: ${{ secrets.HRMS_EMAIL }}
          HRMS_PASSWORD: ${{ secrets.HRMS_PASSWORD }}
          HRMS_ACCOUNTS: ${{ secrets.HRMS_ACCOUNTS }}
          HOLIDAYS: ${{ secrets.HOLIDAYS }}
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          PYTHONUNBUFFERED: 1
        run: python attendance_bot.py ${{ inputs.action }}
